[project]
name = "adjutant"
version = "0.1.0"
description = "A data-flow autonomous development loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich",
    "textual"
]

[project.scripts]
adjutant = "adjutant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
asyncio_mode = "strict"

