[project]
name = "adjutant"
version = "0.1.0"
description = "A data-flow autonomous development loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.9.4",
    "textual>=7.5.0"
]

[project.scripts]
adjutant = "adjutant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
